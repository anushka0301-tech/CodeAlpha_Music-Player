<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="player-card">
    <div class="album-art">
      <img id="cover" src="https://picsum.photos/400/400?random=1" alt="Album Cover">
    </div>

    <div class="track-info">
      <h2 id="title">Select Track</h2>
      <p id="artist">Artist Name</p>
    </div>

    <div class="progress-section">
      <div class="progress-bar-bg" id="progress-container">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>
      <div class="timestamps">
        <span id="current-time">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="prev-btn"><i class="fas fa-backward"></i></button>
      <button class="btn btn-play" id="play-btn"><i class="fas fa-play" id="play-icon"></i></button>
      <button class="btn" id="next-btn"><i class="fas fa-forward"></i></button>
    </div>

    <div class="volume-box">
      <i class="fas fa-volume-high"></i>
      <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.7">
    </div>

    <div class="playlist-section">
      <div class="playlist-title">Up Next</div>
      <ul class="playlist" id="playlist"></ul>
    </div>
  </div>

  <audio id="audio"></audio>
 <script src="script.js"></script>
</body>
</html>
